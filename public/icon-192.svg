<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="indigoTealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Glassmorphic Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ring/Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Rect Backdrop -->
  <rect width="512" height="512" rx="128" fill="url(#indigoTealBg)" />
  
  <!-- Subtle Mesh Glow Effect -->
  <circle cx="400" cy="120" r="180" fill="#3b82f6" opacity="0.15" filter="blur(40px)" />
  <circle cx="120" cy="400" r="150" fill="#10b981" opacity="0.1" filter="blur(40px)" />

  <!-- Outer Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Main Floating Glassmorphic Calendar Base -->
  <g transform="translate(100, 110)">
    <!-- Shadow Card -->
    <rect x="8" y="16" width="312" height="312" rx="48" fill="#000000" opacity="0.4" filter="blur(10px)" />
    
    <!-- White Premium Glass Card -->
    <rect width="312" height="312" rx="48" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Card Top Header Stripe (Indigo) -->
    <path d="M 0 48 A 48 48 0 0 1 48 0 L 264 0 A 48 48 0 0 1 312 48 L 312 76 L 0 76 Z" fill="url(#accentGrad)" />

    <!-- Rings connecting the calendar -->
    <circle cx="80" cy="0" r="12" fill="#020617" />
    <circle cx="80" cy="0" r="6" fill="#f8fafc" />
    
    <circle cx="232" cy="0" r="12" fill="#020617" />
    <circle cx="232" cy="0" r="6" fill="#f8fafc" />

    <!-- Calendar Grid Items -->
    <rect x="40" y="120" width="232" height="18" rx="9" fill="#ffffff" opacity="0.8" />
    <rect x="40" y="160" width="160" height="18" rx="9" fill="#ffffff" opacity="0.5" />
    
    <rect x="40" y="210" width="232" height="18" rx="9" fill="#ffffff" opacity="0.8" />
    <rect x="40" y="250" width="110" height="18" rx="9" fill="#ffffff" opacity="0.5" />

    <!-- Sparkling Star Overlay -->
    <path d="M 270 120 L 273 127 L 280 127 L 275 132 L 277 139 L 270 135 L 263 139 L 265 132 L 260 127 L 267 127 Z" fill="#fbbf24" />
  </g>

  <!-- Giant Glassmorphic Checkmark Badge overlaying at the bottom right -->
  <g transform="translate(280, 280)">
    <!-- Shadow -->
    <circle cx="86" cy="86" r="86" fill="#020617" opacity="0.5" filter="blur(8px)" />
    
    <!-- Badge Background -->
    <circle cx="86" cy="86" r="86" fill="url(#emeraldGlow)" stroke="#ffffff" stroke-width="6" />
    
    <!-- Glowing internal ring -->
    <circle cx="86" cy="86" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- White Checkmark -->
    <path d="M 46 86 L 74 114 L 126 58" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

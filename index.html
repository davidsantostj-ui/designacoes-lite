<!DOCTYPE html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Minhas Designações</title>
    
    <link rel="manifest" href="./manifest.json" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              navy: { 50: '#f0f4ff', 800: '#1e40af', 900: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js",
        "firebase/messaging": "https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging.js"
      }
    }
    </script>

    <style>
      body { -webkit-tap-highlight-color: transparent; }
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      .animate-slide-up { animation: slideUp 0.3s ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
  </head>
  <body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased h-screen overflow-hidden flex justify-center transition-colors duration-300">
    
    <div id="root" class="w-full h-full max-w-md md:max-w-lg lg:max-w-xl bg-slate-50 dark:bg-slate-950 shadow-2xl overflow-y-auto relative flex flex-col transition-colors duration-300"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useMemo } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        Menu, LogOut, X, Home, Calendar as CalIcon, Settings, UserCircle,
        Mic, DoorOpen, Sliders, Video, BookOpen, User as UserIcon, Star, 
        ShieldCheck, AlertTriangle, ChevronRight, Check, Trash2, ChevronLeft, 
        Moon, Sun, Repeat, ExternalLink, Users
      } from 'lucide-react';
      
      import { initializeApp } from 'firebase/app';
      import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, deleteDoc } from 'firebase/firestore';

      // --- CONFIGURAÇÃO FIREBASE ---
      const firebaseConfig = {
        apiKey: "AIzaSyDovn542L52BUsDKu_F8eYEs4lq5oUOOE4",
        authDomain: "minhas-designacoes-app.firebaseapp.com",
        projectId: "minhas-designacoes-app",
        storageBucket: "minhas-designacoes-app.firebasestorage.app",
        messagingSenderId: "33324490818",
        appId: "1:33324490818:web:1c7a75a909cc065a198ddb"
      };

      let app, db;
      try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
      } catch (e) {
        console.error("Erro Firebase:", e);
      }

      const COORDINATOR_PHONE = '5581984867611';

      if ('serviceWorker' in navigator && !['localhost','127.0.0.1'].includes(location.hostname)) {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
             // Checa atualizações imediatamente
             reg.update();
          })
          .catch(e => console.log('SW Info:', e));
      } else {
        // skip service worker in local dev to avoid update/fetch issues
      }

      const AssignmentType = {
        MICROPHONE: 'Microfone Volante', PEDESTAL: 'Pedestal', INDICATOR_ENTRANCE: 'Indicador Entrada',
        INDICATOR_AUDITORIUM: 'Indicador Auditório', AUDIO: 'Sistema de Áudio', VIDEO: 'Sistema de Vídeo',
        READER_WT: 'Leitor A Sentinela', READER_BS: 'Leitor Estudo Bíblico', PRESIDENT: 'Presidente Fim de Semana',
      };

      const AssignmentStatus = {
        PENDING: 'pendente', CONFIRMED: 'confirmado', REJECTED: 'rejeitado', EXCHANGE: 'troca'
      };

      const STATUS_COLORS = {
        'pendente': 'bg-amber-100 text-amber-900 dark:bg-amber-900/30 dark:text-amber-200',
        'confirmado': 'bg-emerald-100 text-emerald-900 dark:bg-emerald-900/30 dark:text-emerald-200',
        'rejeitado': 'bg-red-100 text-red-900 dark:bg-red-900/30 dark:text-red-200',
        'troca': 'bg-blue-100 text-blue-900 dark:bg-blue-900/30 dark:text-blue-200',
      };

      const getIconForType = (type) => {
        const cls = "w-5 h-5";
        try {
          switch (type) {
            case AssignmentType.MICROPHONE: return <Mic className={`${cls} text-blue-600 dark:text-blue-400`} />;
            case AssignmentType.PEDESTAL: return <Mic className={`${cls} text-blue-800 dark:text-blue-300`} />;
            case AssignmentType.INDICATOR_ENTRANCE: return <DoorOpen className={`${cls} text-emerald-600 dark:text-emerald-400`} />;
            case AssignmentType.INDICATOR_AUDITORIUM: return <Users className={`${cls} text-emerald-800 dark:text-emerald-300`} />;
            case AssignmentType.AUDIO: return <Sliders className={`${cls} text-orange-600 dark:text-orange-400`} />;
            case AssignmentType.VIDEO: return <Video className={`${cls} text-purple-600 dark:text-purple-400`} />;
            case AssignmentType.READER_WT: return <BookOpen className={`${cls} text-cyan-600 dark:text-cyan-400`} />;
            case AssignmentType.READER_BS: return <BookOpen className={`${cls} text-cyan-800 dark:text-cyan-300`} />;
            case AssignmentType.PRESIDENT: return <Star className={`${cls} text-yellow-600 dark:text-yellow-400`} />;
            default: return <UserIcon className={`${cls} text-gray-600 dark:text-gray-400`} />;
          }
        } catch (e) {
          return <UserIcon className={cls} />;
        }
      };

      // --- SERVIÇOS ---
      const loginUser = async (name, surname, pin) => {
        const n = (name || '').trim().toLowerCase(); 
        const s = (surname || '').trim().toLowerCase();
        
        if (n === 'david' && s === 'santos' && pin === '1914') {
          return { id: 'super-admin', name: 'David', surname: 'Santos', password: '1914', isAdmin: true };
        }
        
        try {
          const snap = await getDocs(collection(db, 'users'));
          let found = null;
          snap.forEach(d => { 
              const data = d.data(); 
              if (data.name?.toLowerCase() === n && data.surname?.toLowerCase() === s && data.password === pin) {
                  found = { id: d.id, ...data }; 
              }
          });
          return found;
        } catch (e) {
          console.error("Erro Login:", e);
          alert("Erro de conexão. Verifique sua internet.");
          return null;
        }
      };

      const getAllData = async () => {
        try {
          const [usersSnap, assignSnap] = await Promise.all([getDocs(collection(db, 'users')), getDocs(collection(db, 'assignments'))]);
          
          const users = usersSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=> (a.name || "").localeCompare(b.name || ""));
          
          const assignments = assignSnap.docs.map(d => {
              const data = d.data() || {};
              const usuarioId = data.usuario_id || data.userId || data.userID || '';
              const tipo = data.tipo_designacao || data.type || 'Outro';
              const u = users.find(user => user.id === usuarioId);
              return { 
                id: d.id,
                // preserva os dados originais
                ...data,
                // CORREÇÃO CRÍTICA: Se a data estiver vazia, coloca string vazia para não travar
                date: data.date || '', 
                // garante ambas as chaves para compatibilidade
                usuario_id: usuarioId,
                userId: usuarioId,
                tipo_designacao: tipo,
                type: tipo,
                userName: u ? `${u.name} ${u.surname}` : 'Desconhecido'
              };
          }).sort((a,b)=> (a.date || "").localeCompare(b.date || ""));
          
          return { users, assignments };
        } catch (e) {
          console.error("Erro Data:", e);
          return { users: [], assignments: [] };
        }
      };

      const api = {
        createUser: (d) => addDoc(collection(db, 'users'), d),
        deleteUser: (id) => deleteDoc(doc(db, 'users', id)),
        createAssign: (d) => {
          const payload = {
            status: 'pendente',
            motivo_rejeicao: '',
            date: d.date || d.manualDate || '',
            link: d.link || d.linkUrl || '',
            usuario_id: d.usuario_id || d.userId || d.userID || d.selectedUserId || '',
            tipo_designacao: d.tipo_designacao || d.type || d.selectedType || ''
          };
          return addDoc(collection(db, 'assignments'), payload);
        },
        updateStatus: (id, status, reason='') => updateDoc(doc(db, 'assignments', id), { status, motivo_rejeicao: reason }),
        deleteAssign: (id) => deleteDoc(doc(db, 'assignments', id)),
        assignToUser: (assignId, newUserId) => updateDoc(doc(db, 'assignments', assignId), { usuario_id: newUserId, status: 'confirmado' }), 
      };

      const DarkModeToggle = ({ isDark, toggle }) => (
        <button onClick={toggle} className="p-2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-yellow-400 transition">
          {isDark ? <Sun size={20} /> : <Moon size={20} />}
        </button>
      );

      const Layout = ({ user, children, currentView, onNavigate, onLogout, isDark, toggleDark, savedUsers, onSwitchUser }) => {
        const [isMenuOpen, setIsMenuOpen] = useState(false);
        const handleNav = (v) => { onNavigate(v); setIsMenuOpen(false); };

        if (!user) return null;

        return (
          <div className="flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
            <header className="bg-navy-900 dark:bg-slate-900 text-white p-4 shadow-md sticky top-0 z-40 flex-none flex justify-between items-center">
              <div className="flex items-center gap-3">
                <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-white/10 rounded-xl transition active:scale-95"><Menu size={24} /></button>
                <div><h1 className="text-[10px] font-bold uppercase tracking-widest text-blue-200">Minhas Designações</h1><p className="text-lg font-bold leading-tight truncate max-w-[150px]">Olá, {user.name}</p></div>
              </div>
              <div className="flex gap-2">
                 <DarkModeToggle isDark={isDark} toggle={toggleDark} />
                 {user.isAdmin && <div className="hidden sm:flex items-center gap-1 text-[10px] bg-blue-600/30 border border-blue-400/30 px-3 rounded-full font-bold uppercase"><Settings size={12}/> Coord</div>}
              </div>
            </header>

            {isMenuOpen && (
              <div className="fixed inset-0 z-50 flex justify-start">
                <div className="absolute inset-0 bg-navy-950/70 backdrop-blur-sm" onClick={() => setIsMenuOpen(false)}></div>
                <div className="relative bg-white dark:bg-slate-900 w-[85%] max-w-[300px] h-full shadow-2xl flex flex-col p-6 animate-slide-up transition-colors">
                  <div className="flex justify-between items-center mb-8 border-b dark:border-slate-800 pb-6">
                    <div className="flex items-center gap-3">
                       <div className="bg-navy-50 dark:bg-slate-800 text-navy-900 dark:text-white p-2.5 rounded-full"><UserCircle size={28} /></div>
                       <div><p className="font-bold dark:text-white text-lg">{user.name}</p><p className="text-xs text-slate-500 dark:text-slate-400 font-medium">{user.isAdmin ? 'Admin' : 'Voluntário'}</p></div>
                    </div>
                    <button onClick={() => setIsMenuOpen(false)} className="text-slate-400 hover:text-navy-900 dark:hover:text-white"><X size={24} /></button>
                  </div>
                  <nav className="flex-1 space-y-2">
                    {[
                      {id:'DASHBOARD', l:'Início', i: Home},
                      {id:'ASSIGNMENTS_MONTH', l:'Designações', i: CalIcon},
                      {id:'SWAP_MARKET', l:'Mural de Trocas', i: Repeat},
                    ].map(item => (
                      <button key={item.id} onClick={() => handleNav(item.id)} className={`flex items-center gap-4 w-full p-4 rounded-xl text-base font-bold transition-all ${currentView === item.id ? 'bg-navy-900 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                        <item.i size={20} /> {item.l}
                      </button>
                    ))}
                    {user.isAdmin && <button onClick={() => handleNav('ADMIN')} className={`flex items-center gap-4 w-full p-4 rounded-xl text-base font-bold transition-all ${currentView === 'ADMIN' ? 'bg-navy-900 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><Settings size={20} /> Admin</button>}
                  </nav>
                  
                  {savedUsers.length > 1 && (
                    <div className="mb-4 border-t dark:border-slate-800 pt-4">
                      <p className="text-xs font-bold text-slate-400 uppercase mb-2">Alternar Conta</p>
                      {savedUsers.filter(u => u.id !== user.id).map(u => (
                        <button key={u.id} onClick={() => { onSwitchUser(u); setIsMenuOpen(false); }} className="flex items-center gap-2 w-full p-2 text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                           <Users size={16}/> {u.name}
                        </button>
                      ))}
                    </div>
                  )}

                  <button onClick={onLogout} className="flex items-center gap-3 w-full p-4 mt-auto text-red-600 font-bold hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition"><LogOut size={20} /> Sair</button>
                </div>
              </div>
            )}
            <main className="flex-1 w-full p-4 md:p-6 overflow-y-auto pb-20">{children}</main>
          </div>
        );
      };

      const Dashboard = ({ assignments, onSelectDate, onViewAll, changeViewDate, viewDate, userId }) => {
        const currentMonthStr = viewDate.toISOString().slice(0, 7);
        const displayMonth = viewDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        
        // CORREÇÃO CRÍTICA: Filtra apenas itens que TEM data válida
        const userAsgs = assignments.filter(a => a.usuario_id === userId && a.date && a.date.startsWith(currentMonthStr));
        
        const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        const firstDayOfWeek = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
        const calendarDays = useMemo(() => {
          const days = [];
          for (let i = 0; i < firstDayOfWeek; i++) days.push(null);
          for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${currentMonthStr}-${String(i).padStart(2, '0')}`;
            days.push({ day: i, dateStr, hasAssignment: userAsgs.some(a => a.date === dateStr) });
          }
          return days;
        }, [userAsgs, currentMonthStr]);

        return (
          <div className="space-y-6 animate-fade-in">
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center min-h-[100px]">
                <span className="text-3xl font-extrabold text-navy-900 dark:text-white">{userAsgs.length}</span><span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider mt-1">Total Mês</span>
              </div>
              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-emerald-100 dark:border-emerald-900/50 flex flex-col items-center justify-center min-h-[100px]">
                <span className="text-3xl font-extrabold text-emerald-600 dark:text-emerald-400">{userAsgs.filter(a=>a.status===AssignmentStatus.CONFIRMED).length}</span><span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider mt-1">Feitas</span>
              </div>
              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-amber-100 dark:border-amber-900/50 flex flex-col items-center justify-center min-h-[100px]">
                <span className="text-3xl font-extrabold text-amber-500">{userAsgs.filter(a=>a.status===AssignmentStatus.PENDING).length}</span><span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider mt-1">Pendentes</span>
              </div>
            </div>
            
            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
              <div className="flex justify-between items-center mb-6">
                 <button onClick={() => changeViewDate(-1)} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full dark:text-white"><ChevronLeft size={18}/></button>
                 <h2 className="text-lg font-bold text-navy-900 dark:text-white capitalize text-center w-full">{displayMonth}</h2>
                 <button onClick={() => changeViewDate(1)} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full dark:text-white"><ChevronRight size={18}/></button>
              </div>
              <div className="grid grid-cols-7 gap-2 mb-2 text-center">{['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d, i) => <span key={i} className="text-[10px] font-extrabold text-slate-400">{d}</span>)}</div>
              <div className="grid grid-cols-7 gap-2">
                {calendarDays.map((d, idx) => {
                  if (!d) return <div key={idx} />;
                  const today = new Date();
                  const isToday = d.day === today.getDate() && viewDate.getMonth() === today.getMonth();
                  return (
                    <button key={idx} disabled={!d.hasAssignment} onClick={() => d.hasAssignment && onSelectDate(d.dateStr)}
                      className={`aspect-square rounded-full flex items-center justify-center text-sm font-bold transition 
                      ${isToday ? 'ring-2 ring-navy-900 dark:ring-white text-navy-900 dark:text-white' : 'text-slate-600 dark:text-slate-400'} 
                      ${d.hasAssignment ? 'bg-navy-900 dark:bg-blue-600 !text-white hover:bg-navy-800 shadow-md active:scale-95' : ''} 
                      ${!d.hasAssignment && !isToday ? 'opacity-30' : ''}`}>
                      {d.day}
                    </button>
                  );
                })}
              </div>
            </div>
            
            <button className="w-full bg-navy-900 dark:bg-blue-600 text-white p-6 rounded-3xl shadow-xl relative overflow-hidden group text-left transition active:scale-[0.98]" onClick={onViewAll}>
              <div className="relative z-10"><h3 className="font-bold text-xl mb-1">Próximas Tarefas</h3><p className="text-blue-200 text-sm mb-5 font-medium">Veja a lista completa.</p><div className="bg-white/10 w-fit px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">Ver todas <ChevronRight size={16} /></div></div>
            </button>
          </div>
        );
      };

      const SwapMarket = ({ assignments, currentUserId, onTake }) => {
        // CORREÇÃO: Garante que a data existe antes de tentar mostrar
        const swaps = assignments.filter(a => a.status === AssignmentStatus.EXCHANGE && a.usuario_id !== currentUserId && a.date);
        return (
          <div className="space-y-4 animate-fade-in">
             <div className="bg-blue-50 dark:bg-blue-900/30 p-4 rounded-xl border border-blue-200 dark:border-blue-800">
               <h3 className="font-bold text-blue-900 dark:text-blue-200 flex items-center gap-2"><Repeat size={20}/> Mural de Trocas</h3>
               <p className="text-sm text-blue-800 dark:text-blue-300 mt-1">Ajude um irmão aceitando uma designação disponível.</p>
             </div>
             {swaps.length === 0 ? <p className="text-center text-gray-400 mt-10">Nenhuma troca disponível no momento.</p> : swaps.map(a => (
               <div key={a.id} className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700 flex justify-between items-center">
                  <div>
                    <div className="flex gap-2 mb-1"><span className="text-xs font-bold bg-slate-100 dark:bg-slate-700 px-2 rounded dark:text-white">{a.date.split('-').reverse().join('/')}</span></div>
                    <h4 className="font-bold text-navy-900 dark:text-white">{a.type}</h4>
                    <p className="text-xs text-gray-500 dark:text-gray-400">De: {a.userName}</p>
                  </div>
                  <button onClick={() => onTake(a)} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow hover:bg-green-700 transition">Assumir</button>
               </div>
             ))}
          </div>
        );
      }

      const AdminPanel = ({ users, assignments, refresh }) => {
        const [activeTab, setActiveTab] = useState('assignments');
        const [manualDate, setManualDate] = useState('');
        const [selectedUserId, setSelectedUserId] = useState('');
        const [selectedType, setSelectedType] = useState('');
        const [linkUrl, setLinkUrl] = useState('');
        const [newUser, setNewUser] = useState({ name: '', surname: '', phone: '', isAdmin: false });

        const handleCreate = async () => {
          if(!manualDate || !selectedType || !selectedUserId) return;
          await api.createAssign({ manualDate, selectedType, selectedUserId, linkUrl });
          refresh(); alert('Criado!'); setManualDate(''); setLinkUrl('');
        };
        const handleNewUser = async (e) => {
          e.preventDefault(); const pin = Math.floor(1000+Math.random()*9000).toString();
          await api.createUser({...newUser, password: pin, isAdmin: !!newUser.isAdmin}); refresh(); alert(`PIN: ${pin}`); setNewUser({name:'',surname:'',phone:'', isAdmin:false});
        }

        // Filters for users view
        const [filterName, setFilterName] = useState('');
        const [filterDate, setFilterDate] = useState('');
        const [filterType, setFilterType] = useState('');

        const filteredUsers = users.filter(u => {
          if (filterName) {
            const full = `${u.name} ${u.surname}`.toLowerCase();
            if (!full.includes(filterName.toLowerCase())) return false;
          }
          if (filterDate) {
            const has = assignments.some(a => (a.usuario_id === u.id || a.userId === u.id) && a.date === filterDate);
            if (!has) return false;
          }
          if (filterType) {
            const has = assignments.some(a => (a.usuario_id === u.id || a.userId === u.id) && a.type === filterType);
            if (!has) return false;
          }
          return true;
        });

        return (
          <div className="pb-20 space-y-4">
             <div className="flex bg-white dark:bg-slate-800 p-1 rounded-xl shadow border dark:border-slate-700 overflow-x-auto sticky top-0 z-10">
               {[{id:'assignments',l:'Designações'},{id:'users',l:'Usuários'}].map(t => (
                 <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`flex-1 py-2 px-4 whitespace-nowrap text-xs font-bold rounded-lg ${activeTab===t.id?'bg-navy-900 dark:bg-blue-600 text-white':'text-slate-500 dark:text-slate-400'}`}>{t.l}</button>
               ))}
             </div>
             {activeTab === 'assignments' && (
               <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border dark:border-slate-700 space-y-3">
                  <h3 className="font-bold dark:text-white">Nova Designação</h3>
                  <input type="date" value={manualDate} onChange={e=>setManualDate(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white" />
                  <select value={selectedUserId} onChange={e=>setSelectedUserId(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white"><option value="">Irmão...</option>{users.map(u=><option key={u.id} value={u.id}>{u.name} {u.surname}</option>)}</select>
                  <input placeholder="Link da Matéria (Opcional)" value={linkUrl} onChange={e=>setLinkUrl(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white text-sm" />
                  <div className="grid grid-cols-2 gap-2">{Object.values(AssignmentType).map(t=><button key={t} onClick={()=>setSelectedType(t)} className={`p-2 border rounded text-[10px] font-bold ${selectedType===t?'bg-navy-900 text-white':''}`}>{t}</button>)}</div>
                  <button onClick={handleCreate} className="w-full bg-green-600 text-white p-3 rounded font-bold">Criar</button>
                  <div className="mt-4 pt-4 border-t dark:border-slate-700 space-y-2">
                     <p className="font-bold text-xs dark:text-white">Recentes</p>
                     {assignments.slice(0,10).map(a=><div key={a.id} className="flex justify-between items-center text-xs p-2 border rounded dark:border-slate-700 dark:text-slate-300"><span>{a.type} - {a.userName}</span><button onClick={async()=>{if(confirm('Del?')) {await api.deleteAssign(a.id); refresh();}}}><Trash2 size={14} className="text-red-400"/></button></div>)}
                  </div>
               </div>
             )}
             {activeTab === 'users' && (
               <div className="space-y-4">
                 <form onSubmit={handleNewUser} className="bg-white dark:bg-slate-800 p-4 rounded-xl border dark:border-slate-700 space-y-2">
                   <input placeholder="Nome" value={newUser.name} onChange={e=>setNewUser({...newUser,name:e.target.value})} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white" required/>
                   <input placeholder="Sobrenome" value={newUser.surname} onChange={e=>setNewUser({...newUser,surname:e.target.value})} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white" required/>
                   <input placeholder="Telefone (Opcional)" value={newUser.phone} onChange={e=>setNewUser({...newUser,phone:e.target.value})} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white" />
                   <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={newUser.isAdmin} onChange={e=>setNewUser({...newUser,isAdmin:e.target.checked})} /> Dar permissões de Admin</label>
                   <button className="w-full bg-navy-900 text-white p-2 rounded font-bold">Cadastrar</button>
                 </form>

                 <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border dark:border-slate-700 space-y-2">
                   <h4 className="font-bold">Filtros</h4>
                   <input placeholder="Filtrar por nome" value={filterName} onChange={e=>setFilterName(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white text-sm" />
                   <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white text-sm" />
                   <select value={filterType} onChange={e=>setFilterType(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white text-sm"><option value="">Todas as funções</option>{Object.values(AssignmentType).map(t=><option key={t} value={t}>{t}</option>)}</select>
                   <div className="flex gap-2"><button onClick={()=>{setFilterName('');setFilterDate('');setFilterType('');}} className="p-2 bg-slate-100 rounded">Limpar</button></div>
                 </div>

                 {filteredUsers.map(u=>(
                   <div key={u.id} className="bg-white dark:bg-slate-800 p-3 border dark:border-slate-700 rounded-lg flex justify-between dark:text-slate-300">
                     <div>
                       <p className="font-bold">{u.name} {u.surname} {u.isAdmin ? <span className="text-xs bg-blue-600 text-white px-2 py-0.5 rounded ml-2">Admin</span> : null}</p>
                       <p className="text-xs">PIN: {u.password}</p>
                     </div>
                     <div className="flex items-center gap-2">
                       <button onClick={async()=>{if(confirm('Del?')){await api.deleteUser(u.id); refresh();}}}><Trash2 size={16}/></button>
                     </div>
                   </div>
                 ))}
               </div>
             )}
          </div>
        );
      };

      const ErrorFallback = ({ error }) => (
        <div className="min-h-screen bg-red-50 flex items-center justify-center p-6 text-center">
           <div>
             <AlertTriangle size={48} className="text-red-500 mx-auto mb-4"/>
             <h2 className="text-xl font-bold text-red-900 mb-2">Ops! Algo deu errado.</h2>
             <p className="text-red-600 mb-4 text-sm">{error.message}</p>
             <button onClick={()=>window.location.reload()} className="bg-red-600 text-white px-6 py-3 rounded-full font-bold">Recarregar App</button>
             <button onClick={()=>{localStorage.clear(); window.location.reload()}} className="block mx-auto mt-4 text-xs text-red-400 underline">Limpar Dados Locais (Reset)</button>
           </div>
        </div>
      );

      const App = () => {
        const [hasError, setHasError] = useState(false);
        const [errorMsg, setErrorMsg] = useState('');

        const [user, setUser] = useState(null);
        const [savedUsers, setSavedUsers] = useState([]);
        const [view, setView] = useState('LOGIN');
        const [data, setData] = useState({ users: [], assignments: [] });
        const [viewDate, setViewDate] = useState(new Date());
        const [selectedDate, setSelectedDate] = useState('');
        const [selectedAssignment, setSelectedAssignment] = useState(null);
        const [rejectionReason, setRejectionReason] = useState('');
        const [reassignTargetId, setReassignTargetId] = useState('');
        const [isDark, setIsDark] = useState(localStorage.getItem('theme') === 'dark');

          // Login form states (must be top-level hooks)
          const [isAdminMode, setIsAdminMode] = useState(false);
          const [n, setN] = useState('');
          const [s, setS] = useState('');
          const [p, setP] = useState('');
          const [loginError, setLoginError] = useState('');
          const [loading, setLoading] = useState(false);

          const doLogin = async (e) => { 
            e.preventDefault(); setLoginError(''); setLoading(true);
            const u = await loginUser(n,s,p); 
            setLoading(false);
            if(u) {
              if (isAdminMode && !u.isAdmin) {
                setLoginError('Acesso negado: Este usuário não é Admin.');
                return;
              }
              handleLogin(u);
            } else {
              setLoginError('Dados incorretos.');
            }
          };

        // Error Boundary Simples
        useEffect(() => {
          const errorHandler = (e) => {
             console.error(e);
             setHasError(true);
             setErrorMsg(e.message || "Erro desconhecido");
          };
          window.addEventListener('error', errorHandler);
          window.addEventListener('unhandledrejection', errorHandler);
          return () => {
             window.removeEventListener('error', errorHandler);
             window.removeEventListener('unhandledrejection', errorHandler);
          }
        }, []);

        const toggleDark = () => {
           const newVal = !isDark; setIsDark(newVal); 
           localStorage.setItem('theme', newVal ? 'dark' : 'light');
           document.documentElement.classList.toggle('dark', newVal);
           document.documentElement.classList.toggle('light', !newVal);
        };
        useEffect(() => { 
           if (isDark) { document.documentElement.classList.add('dark'); } 
           else { document.documentElement.classList.remove('dark'); }
        }, []);

        useEffect(() => {
           const saved = localStorage.getItem('app_saved_users');
           if(saved) setSavedUsers(JSON.parse(saved));
        }, []);

        const fetchData = async () => { const d = await getAllData(); setData(d); };
        useEffect(() => { if (user) fetchData(); }, [user]);

        const handleLogin = (u) => {
           setUser(u); setView('DASHBOARD');
           setSavedUsers(prev => {
              const exists = prev.find(su => su.id === u.id);
              const newList = exists ? prev : [...prev, u];
              localStorage.setItem('app_saved_users', JSON.stringify(newList));
              return newList;
           });
        };

        const handleSwitchUser = (u) => { setUser(u); setView('DASHBOARD'); };
        
        const confirmAsg = async (a) => { await api.updateStatus(a.id, AssignmentStatus.CONFIRMED); await fetchData(); setSelectedAssignment(null); };
        const rejectAsg = async () => {
           if(!rejectionReason) return;
           await api.updateStatus(selectedAssignment.id, AssignmentStatus.REJECTED, rejectionReason);
           const msg = `Olá! Sou ${user.name}. Rejeitei: ${selectedAssignment.type} (${selectedAssignment.date}). Motivo: ${rejectionReason}`;
           window.open(`https://wa.me/${COORDINATOR_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
           await fetchData(); setSelectedAssignment(null); setRejectionReason('');
        };
          const reassignAssignment = async () => {
            if(!reassignTargetId) return;
            if(!selectedAssignment) return;
            if(!confirm(`Atribuir ${selectedAssignment.type} (${selectedAssignment.date}) para este usuário?`)) return;
            await api.assignToUser(selectedAssignment.id, reassignTargetId);
            await fetchData(); setSelectedAssignment(null); setReassignTargetId(''); alert('Designação reatribuída com sucesso!');
          };
        const requestExchange = async () => {
           await api.updateStatus(selectedAssignment.id, AssignmentStatus.EXCHANGE);
           await fetchData(); setSelectedAssignment(null); alert("Solicitação enviada para o Mural de Trocas!");
        };
        const takeExchange = async (a) => {
           if(confirm(`Assumir ${a.type} no dia ${a.date}?`)) {
              await api.assignToUser(a.id, user.id);
              await fetchData(); alert("Designação assumida com sucesso!");
           }
        };

          if (hasError) return <ErrorFallback error={{message: errorMsg}} />;

           if (!user || view === 'LOGIN') {
            return (
             <div className="min-h-screen bg-navy-950 flex flex-col items-center justify-center p-6">
                <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl animate-fade-in">
                   <h1 className="text-2xl font-extrabold text-navy-900 text-center mb-6">Minhas Designações</h1>
                   
                   {/* ABAS VOLUNTÁRIO / ADMIN */}
                   <div className="flex bg-slate-100 rounded-full p-1 mb-6">
                      <button onClick={() => setIsAdminMode(false)} className={`flex-1 py-2 rounded-full text-sm font-bold transition ${!isAdminMode ? 'bg-navy-900 text-white shadow' : 'text-slate-500'}`}>Voluntário</button>
                      <button onClick={() => setIsAdminMode(true)} className={`flex-1 py-2 rounded-full text-sm font-bold transition ${isAdminMode ? 'bg-navy-900 text-white shadow' : 'text-slate-500'}`}>Admin</button>
                   </div>

                   {/* Lista Contas Salvas (Apenas Voluntário) */}
                   {!isAdminMode && savedUsers.length > 0 && (
                     <div className="mb-6 grid gap-2">
                        <p className="text-xs font-bold text-gray-400 uppercase text-center">Contas Salvas</p>
                        {savedUsers.map(u => (
                          <button key={u.id} onClick={()=>handleLogin(u)} className="flex items-center gap-3 p-3 bg-gray-50 hover:bg-blue-50 rounded-xl transition border border-gray-100 text-left">
                             <div className="bg-blue-100 text-blue-700 p-2 rounded-full"><UserCircle size={20}/></div>
                             <div><p className="font-bold text-navy-900 text-sm">{u.name} {u.surname}</p></div>
                             <ChevronRight size={16} className="ml-auto text-gray-400"/>
                          </button>
                        ))}
                     </div>
                   )}

                   <form onSubmit={doLogin} className="space-y-4 pt-4 border-t">
                      <p className="text-xs font-bold text-gray-400 uppercase text-center">{isAdminMode ? 'Acesso Restrito' : 'Entrar com nova conta'}</p>
                      <input placeholder="Nome" value={n} onChange={e=>setN(e.target.value)} className="w-full p-3 bg-gray-50 rounded-xl border text-navy-900 font-bold outline-none focus:ring-2 focus:ring-navy-900" required />
                      <input placeholder="Sobrenome" value={s} onChange={e=>setS(e.target.value)} className="w-full p-3 bg-gray-50 rounded-xl border text-navy-900 font-bold outline-none focus:ring-2 focus:ring-navy-900" required />
                      <input type="tel" maxLength={4} placeholder="PIN (4 dígitos)" value={p} onChange={e=>setP(e.target.value)} className="w-full p-3 bg-gray-50 rounded-xl border text-navy-900 font-bold text-center tracking-widest text-lg outline-none focus:ring-2 focus:ring-navy-900" required />
                      
                       {loginError && <div className="text-center text-red-600 text-xs font-bold bg-red-50 p-2 rounded">{loginError}</div>}
                      
                       <button disabled={loading} className="w-full bg-navy-900 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition">
                         {loading ? 'Entrando...' : (isAdminMode ? 'Acessar Admin' : 'Entrar')}
                       </button>
                   </form>
                </div>
             </div>
          );
        }

        return (
          <>
            <Layout user={user} currentView={view} onNavigate={setView} onLogout={()=>{setUser(null);setView('LOGIN')}} isDark={isDark} toggleDark={toggleDark} savedUsers={savedUsers} onSwitchUser={handleSwitchUser}>
              {view === 'DASHBOARD' && <Dashboard assignments={data.assignments} userId={user.id} viewDate={viewDate} changeViewDate={(d)=>{const nd=new Date(viewDate);nd.setMonth(nd.getMonth()+d);setViewDate(nd)}} onSelectDate={d=>{setSelectedDate(d);setView('ASSIGNMENTS_DAY')}} onViewAll={()=>setView('ASSIGNMENTS_MONTH')} />}
              {view === 'ADMIN' && <AdminPanel users={data.users} assignments={data.assignments} refresh={fetchData}/>}
              {view === 'SWAP_MARKET' && <SwapMarket assignments={data.assignments} currentUserId={user.id} onTake={takeExchange} />}
              {(view === 'ASSIGNMENTS_MONTH' || view === 'ASSIGNMENTS_DAY') && (
                <div className="pb-10">
                  <div className="flex items-center gap-2 mb-4">
                    <button onClick={()=>setView('DASHBOARD')} className="p-2 bg-white dark:bg-slate-800 rounded-full border dark:border-slate-700 dark:text-white"><ChevronLeft/></button>
                    <h2 className="text-xl font-bold dark:text-white">{view==='ASSIGNMENTS_DAY'?'Dia':'Todas'}</h2>
                  </div>
                  <div className="space-y-3">
                    {data.assignments.filter(a=>a.usuario_id===user.id && (view==='ASSIGNMENTS_DAY'?a.date===selectedDate:true)).map(a=>(
                      <div key={a.id} onClick={()=>setSelectedAssignment(a)} className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700 relative overflow-hidden cursor-pointer active:scale-[0.98] transition">
                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${STATUS_COLORS[a.status].split(' ')[0]}`}></div>
                        <div className="flex justify-between items-center pl-3">
                           <div className="flex gap-3 items-center">
                             <div className="bg-slate-50 dark:bg-slate-700 p-2 rounded-full">{getIconForType(a.type)}</div>
                             <div><h3 className="font-bold dark:text-white">{a.type}</h3><p className="text-xs text-gray-500 dark:text-gray-400">{a.date.split('-').reverse().join('/')}</p></div>
                           </div>
                           <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded ${STATUS_COLORS[a.status]}`}>{a.status}</span>
                        </div>
                      </div>
                    ))}
                    {data.assignments.filter(a=>a.usuario_id===user.id && (view==='ASSIGNMENTS_DAY'?a.date===selectedDate:true)).length===0 && <p className="text-center text-gray-400 mt-10">Nenhuma designação.</p>}
                  </div>
                </div>
              )}
            </Layout>

            {selectedAssignment && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-navy-900/60 backdrop-blur-sm animate-fade-in">
                <div className="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 animate-slide-up shadow-2xl">
                    <div className="flex justify-between mb-6 border-b dark:border-slate-800 pb-4">
                      <div className="flex gap-3">
                        <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl h-fit">{getIconForType(selectedAssignment.type)}</div>
                        <div><h3 className="text-2xl font-extrabold text-navy-900 dark:text-white leading-none mb-1">{selectedAssignment.type}</h3><p className="text-gray-500 font-medium">{selectedAssignment.date.split('-').reverse().join('/')}</p></div>
                      </div>
                      <button onClick={()=>setSelectedAssignment(null)} className="p-2 bg-gray-100 dark:bg-slate-800 rounded-full h-fit text-gray-500"><X size={20}/></button>
                    </div>

                    {selectedAssignment.link && (
                      <a href={selectedAssignment.link} target="_blank" className="flex items-center justify-center gap-2 w-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-300 font-bold p-3 rounded-xl mb-4 border border-blue-100 dark:border-blue-800">
                        <ExternalLink size={18}/> Abrir Material de Estudo
                      </a>
                    )}

                    {selectedAssignment.status === 'pendente' && (
                      <div className="space-y-3">
                        <button onClick={()=>confirmAsg(selectedAssignment)} className="w-full bg-navy-900 dark:bg-blue-600 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg"><Check size={20}/> Confirmar</button>
                        <button onClick={requestExchange} className="w-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 p-3 rounded-xl font-bold flex items-center justify-center gap-2"><Repeat size={18}/> Solicitar Substituição</button>
                        <div className="border-t dark:border-slate-800 pt-4 mt-2">
                           <textarea value={rejectionReason} onChange={e=>setRejectionReason(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 p-3 rounded-xl mb-2 text-sm dark:text-white" placeholder="Motivo para rejeitar (Ex: Doença)..." rows={2}></textarea>
                           <button onClick={rejectAsg} disabled={!rejectionReason} className="w-full border border-red-100 dark:border-red-900 text-red-500 p-3 rounded-xl font-bold text-sm">Rejeitar Definitivamente</button>
                        </div>
                      </div>
                    )}
                    {selectedAssignment.status === 'confirmado' && <div className="bg-green-50 dark:bg-green-900/20 p-4 rounded-xl text-green-800 dark:text-green-400 font-bold flex gap-2"><Check/> Designação Confirmada</div>}
                    {selectedAssignment.status === 'troca' && <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl text-blue-800 dark:text-blue-400 font-bold flex gap-2"><Repeat/> Aguardando Substituição</div>}
                    {selectedAssignment.status === 'rejeitado' && (
                      <div className="space-y-3">
                        <div className="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl text-red-800 dark:text-red-400 font-bold">Esta designação foi rejeitada.</div>
                        <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border dark:border-slate-700">
                          <p className="text-sm mb-2">Atribuir para outro usuário:</p>
                          <select value={reassignTargetId} onChange={e=>setReassignTargetId(e.target.value)} className="w-full p-2 border rounded dark:bg-slate-700 dark:text-white mb-2">
                            <option value="">Selecionar irmão...</option>
                            {data.users.filter(u=>u.id !== selectedAssignment.usuario_id).map(u=> (
                              <option key={u.id} value={u.id}>{u.name} {u.surname}</option>
                            ))}
                          </select>
                          <div className="flex gap-2">
                            <button disabled={!reassignTargetId} onClick={reassignAssignment} className="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Atribuir</button>
                            <button onClick={()=>{api.deleteAssign(selectedAssignment.id); setSelectedAssignment(null); fetchData();}} className="w-full bg-red-100 text-red-600 p-3 rounded-xl font-bold">Remover</button>
                          </div>
                        </div>
                      </div>
                    )}
                </div>
              </div>
            )}
          </>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
